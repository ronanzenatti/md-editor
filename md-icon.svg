<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows for 3D depth at any resolution -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>

    <filter id="pencilShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- High-Contrast Ultra-Visible MD Badge Gradient -->
    <linearGradient id="mdBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Pencil Body Gradient -->
    <linearGradient id="pencilBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Metal Ferrule Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Eraser Gradient -->
    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <!-- Pencil Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Document Sheet Group -->
  <g filter="url(#dropShadow)">
    <!-- Main Paper Sheet with Folded Corner -->
    <path d="M 90 40 
             H 330 
             L 430 140 
             V 440 
             A 28 28 0 0 1 402 468 
             H 90 
             A 28 28 0 0 1 62 440 
             V 68 
             A 28 28 0 0 1 90 40 Z" 
          fill="url(#paperGrad)" 
          stroke="#E2E8F0" 
          stroke-width="4"/>

    <!-- Folded Corner Flap -->
    <path d="M 330 40 
             V 112 
             A 28 28 0 0 0 358 140 
             H 430 Z" 
          fill="url(#foldGrad)"/>
  </g>

  <!-- GIANT HIGH-VISIBILITY "MD" BADGE (Designed for 32x32 Legibility) -->
  <g transform="translate(96, 85)">
    <!-- High Contrast Violet Badge Container -->
    <rect x="0" y="0" width="225" height="125" rx="22" fill="url(#mdBadgeGrad)"/>
    
    <!-- Inner subtle glow frame -->
    <rect x="3" y="3" width="219" height="119" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Bold Crisp Extra Large "MD" Text -->
    <text x="112.5" y="90" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="84" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="3">MD</text>
  </g>

  <!-- Document Lines below MD Badge -->
  <!-- Primary Accent Header Line -->
  <rect x="96" y="238" width="220" height="16" rx="8" fill="#4F46E5"/>
  
  <!-- Text Paragraph Lines -->
  <rect x="96" y="272" width="280" height="14" rx="7" fill="#94A3B8"/>
  <rect x="96" y="302" width="240" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="96" y="332" width="180" height="14" rx="7" fill="#CBD5E1"/>

  <!-- Code Block Quote Line -->
  <rect x="96" y="370" width="16" height="54" rx="5" fill="#7C3AED"/>
  <rect x="124" y="376" width="150" height="12" rx="6" fill="#94A3B8"/>
  <rect x="124" y="402" width="110" height="12" rx="6" fill="#CBD5E1"/>

  <!-- Pencil Group (Angled and Overlaying Document) -->
  <g transform="translate(350, 355) rotate(-40)" filter="url(#pencilShadow)">
    <!-- Eraser -->
    <path d="M -145 -20 H -125 V 20 H -145 A 9 9 0 0 1 -154 11 V -11 A 9 9 0 0 1 -145 -20 Z" fill="url(#eraserGrad)"/>

    <!-- Ferrule (Metal Ring) -->
    <rect x="-125" y="-20" width="24" height="40" rx="3" fill="url(#metalGrad)"/>
    <line x1="-113" y1="-20" x2="-113" y2="20" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5"/>

    <!-- Pencil Hexagonal Shaft -->
    <rect x="-101" y="-20" width="145" height="40" rx="4" fill="url(#pencilBodyGrad)"/>
    <!-- Shaft facet lines -->
    <line x1="-101" y1="-7" x2="44" y2="-7" stroke="#FDE68A" stroke-opacity="0.5" stroke-width="2.5"/>
    <line x1="-101" y1="7" x2="44" y2="7" stroke="#D97706" stroke-opacity="0.5" stroke-width="2.5"/>

    <!-- Wood Cone Tip -->
    <path d="M 44 -20 L 90 0 L 44 20 Z" fill="url(#woodGrad)"/>

    <!-- Graphite Lead Tip -->
    <path d="M 74 -7 L 90 0 L 74 7 Z" fill="#0F172A"/>

    <!-- Sparkle/Glow at Lead Point -->
    <circle cx="90" cy="0" r="4" fill="#6366F1" opacity="0.8"/>
  </g>

</svg>
